<script>
(function () {
  var win = document.getElementById('win'), stage = document.getElementById('stage');
  function fit() {
    var w = win.clientWidth, h = win.clientHeight, k = Math.min(w / 500, h / 720) * 0.86;
    stage.style.transform = 'translate(' + (w - 500 * k) / 2 + 'px,' + (h - 720 * k) / 2 + 'px) scale(' + k + ')';
  }
  fit(); window.addEventListener('resize', fit);

  var tl = gsap.timeline({ repeat: -1, repeatDelay: .3 });
  tl.set('#art', { opacity: 1 }, 0);
  ['F', 'C', 'P', 'G'].forEach(function (k, i) {
    var at = .2 + i * 2.2;
    tl.fromTo('#L' + k, { y: -70, opacity: 0 }, { y: 0, opacity: 1, duration: 1.3, ease: 'power3.out' }, at);
    tl.fromTo('#L' + k + ' .it', { opacity: 0 }, { opacity: 1, duration: .5, stagger: .06, ease: 'power1.out' }, at + .8);
    tl.fromTo('#T' + k, { x: -8, opacity: 0 }, { x: 0, opacity: 1, duration: .7, ease: 'power2.out' }, at + .9);
    // dim the layers already in place
    var prev = ['F', 'C', 'P', 'G'].slice(0, i);
    if (prev.length) {
      tl.to(prev.map(function (p) { return '#L' + p; }), { opacity: .4, duration: .8, ease: 'power1.out' }, at + .1);
      tl.to(prev.map(function (p) { return '#T' + p; }), { opacity: .45, duration: .8, ease: 'power1.out' }, at + .1);
    }
  });
  // bring the full stack back for the final hold
  tl.to('#LF, #LC, #LP, #TF, #TC, #TP', { opacity: 1, duration: .9, ease: 'power1.inOut' }, 9.0);
  tl.to('#art', { opacity: 0, duration: .3, ease: 'power1.in' }, 15.6);

  var pp = document.getElementById('pp');
  function sync() { var p = tl.paused(); pp.classList.toggle('paused', p); pp.setAttribute('aria-label', p ? 'Play animation' : 'Pause animation'); }
  pp.addEventListener('click', function () { tl.paused() ? tl.play() : tl.pause(); sync(); });
  var q = new URLSearchParams(location.search).get('t');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (q !== null) tl.pause(parseFloat(q)); else if (reduce) tl.pause(11);
  sync();
})();
</script>
